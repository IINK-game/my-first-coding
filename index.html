<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>はじめてのゲーム</title>
</head>
<body>
  <h1>ブロック崩し</h1>
  <canvas id="game" width="600" height="400"
          style="background: #182030;"></canvas>
次は、ゲーム画面に**ボールとバー**を描こう！

GitHubで `index.html` を開いて、右上の **鉛筆マーク ✏️** を押してね。

`</body>` の**すぐ上**に、これを追加しよう。

```html
<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // 白いボール
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(300, 300, 8, 0, Math.PI * 2);
  ctx.fill();

  // 緑のバー
  ctx.fillStyle = "lightgreen";
  ctx.fillRect(250, 370, 100, 12);
</script>
```

追加したら **「Commit changes…」で保存**してね。まだ動かないけど、次にボールを動かすよ！
</body>
</html>
